<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI-VISION 智能环卫监控平台</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        /* 导入科幻数字字体与中文字体 */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #03060f;
            /* 科幻网格背景 */
            background-image: 
                linear-gradient(rgba(0, 206, 201, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 206, 201, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #e0e6ed; min-height: 100vh; padding: 20px; overflow-x: hidden;
        }
        
        /* === 头部与导航 === */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 15px 30px;
            background: linear-gradient(90deg, rgba(0,206,201,0.15) 0%, rgba(3,6,15,0.8) 20%, rgba(3,6,15,0.8) 80%, rgba(0,206,201,0.15) 100%);
            border-top: 2px solid #00cec9; border-bottom: 1px solid rgba(0, 206, 201, 0.3);
            position: relative;
        }
        .header::before { content: ''; position: absolute; top: -2px; left: 0; width: 100px; height: 2px; background: #fff; box-shadow: 0 0 10px #fff;}
        .header::after { content: ''; position: absolute; bottom: -1px; right: 0; width: 150px; height: 1px; background: #00cec9; box-shadow: 0 0 10px #00cec9;}
        
        .title-box { display: flex; align-items: center; gap: 15px;}
        .title { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: 2px;}
        .title span { color: #00cec9; text-shadow: 0 0 15px rgba(0, 206, 201, 0.8); }
        
        .right-header { display: flex; align-items: center; gap: 20px; }
        .clock { font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #00cec9; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,206,201,0.5);}
        
        .status-badge { display: flex; align-items: center; font-size: 13px; font-weight: bold; background: rgba(0,206,201,0.05); padding: 6px 15px; border: 1px solid rgba(0,206,201,0.3); letter-spacing: 1px;}
        .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 10px; background-color: #ff4757; box-shadow: 0 0 10px #ff4757;}
        .dot.active { background-color: #00ff88; box-shadow: 0 0 15px #00ff88; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .action-btn {
            background: rgba(0, 206, 201, 0.1); border: 1px solid #00cec9; color: #00cec9;
            padding: 6px 15px; font-size: 13px; font-weight: bold; cursor: pointer;
            transition: all 0.3s; border-radius: 4px; display: flex; align-items: center; gap: 5px;
        }
        .action-btn:hover { background: #00cec9; color: #000; box-shadow: 0 0 20px rgba(0,206,201,0.6); }

        .dashboard { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }

        /* === 卡片与 HUD 特效 === */
        .card {
            background: rgba(4, 9, 20, 0.8); backdrop-filter: blur(5px);
            padding: 25px; border: 1px solid rgba(0, 206, 201, 0.2); position: relative;
        }
        .card::before, .card::after { content: ''; position: absolute; width: 20px; height: 20px; pointer-events: none; }
        .card::before { top: -1px; left: -1px; border-top: 2px solid #00cec9; border-left: 2px solid #00cec9; }
        .card::after { bottom: -1px; right: -1px; border-bottom: 2px solid #00cec9; border-right: 2px solid #00cec9; }
        .card-inner-corner1 { position: absolute; top: -1px; right: -1px; width: 20px; height: 20px; border-top: 2px solid #00cec9; border-right: 2px solid #00cec9; pointer-events: none;}
        .card-inner-corner2 { position: absolute; bottom: -1px; left: -1px; width: 20px; height: 20px; border-bottom: 2px solid #00cec9; border-left: 2px solid #00cec9; pointer-events: none;}

        .section-title { font-size: 16px; color: #00cec9; margin-bottom: 20px; font-weight: bold; letter-spacing: 1px; border-bottom: 1px solid rgba(0,206,201,0.2); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .section-title span { font-size: 12px; color: #576574; font-weight: normal;}

        /* 消防紧急横幅 */
        #emergency-banner {
            display: none; background: #ff0000; color: #fff; padding: 12px 20px; 
            text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 16px; letter-spacing: 1px;
            border: 2px solid #ff4757; box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 30px rgba(255, 0, 0, 0.8);
            animation: strobe 0.3s infinite alternate;
        }
        @keyframes strobe { 0% { opacity: 1; } 100% { opacity: 0.8; background: #cc0000; } }

        /* 视频监控区 */
        .video-wrapper { position: relative; width: 100%; border: 1px solid #00cec9; background: #000; padding: 2px;}
        #stream-img { width: 100%; aspect-ratio: 4/3; object-fit: contain; display: block; filter: contrast(1.1) brightness(1.1);}
        .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 50px; background: linear-gradient(to bottom, transparent, rgba(0, 206, 201, 0.2), transparent); z-index: 2; pointer-events: none; animation: radarScan 4s linear infinite; border-bottom: 1px solid rgba(0,206,201,0.5);}
        @keyframes radarScan { 0% { top: -50px; } 100% { top: 100%; } }

        /* === 传感器矩阵 (带精美图标) === */
        .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .sensor-box { 
            background: rgba(0, 206, 201, 0.05); border: 1px solid rgba(0, 206, 201, 0.2); 
            padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; transition: all 0.3s; text-align: center;
        }
        .sensor-box:hover { background: rgba(0, 206, 201, 0.1); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0, 206, 201, 0.2);}
        
        .sensor-icon { font-size: 32px; margin-bottom: 5px; filter: drop-shadow(0 0 8px rgba(0, 206, 201, 0.5));}
        .sensor-label { font-size: 13px; color: #a4b0be; letter-spacing: 1px; margin-bottom: 2px; font-weight: bold;}
        .sensor-value { font-size: 26px; font-family: 'Share Tech Mono', monospace; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); display: flex; align-items: baseline; gap: 5px;}
        .sensor-unit { font-size: 12px; color: #00cec9; }

        /* 历史与检索功能 */
        .history-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .stats-bar { display: flex; justify-content: space-between; font-size: 13px; color: #00cec9; border-bottom: 1px dashed rgba(0,206,201,0.3); padding-bottom: 8px; font-weight: bold;}
        .stat-danger { color: #ff4757; text-shadow: 0 0 5px rgba(255,71,87,0.5);}

        .search-row { display: flex; gap: 10px; }
        .search-input { flex-grow: 1; background: rgba(0, 206, 201, 0.05); border: 1px solid rgba(0, 206, 201, 0.3); color: #fff; padding: 8px 10px; font-size: 13px; outline: none; border-radius: 4px;}
        .search-input:focus { background: rgba(0, 206, 201, 0.1); border-color: #00cec9; box-shadow: 0 0 10px rgba(0, 206, 201, 0.2); }
        .search-input::placeholder { color: rgba(0, 206, 201, 0.4); }

        .history-container { flex-grow: 1; overflow-y: auto; max-height: 480px; padding-right: 5px; }
        .history-container::-webkit-scrollbar { width: 4px; }
        .history-container::-webkit-scrollbar-thumb { background: #00cec9; border-radius: 4px;}
        
        .history-item { border-left: 4px solid #feca57; margin-bottom: 15px; padding: 12px; background: rgba(0, 0, 0, 0.4); border-radius: 0 8px 8px 0;}
        .history-item.emergency { border-left: 4px solid #ff0000; background: rgba(255, 0, 0, 0.15); }
        
        .history-header { display: flex; flex-direction: column; margin-bottom: 8px;}
        .history-header-time { color: #8395a7; font-size: 11px; margin-bottom: 4px; font-family: 'Share Tech Mono', monospace;}
        .history-header-title { color: #feca57; font-size: 14px; font-weight: bold; letter-spacing: 1px;}
        .history-item.emergency .history-header-title { color: #ff4757; text-shadow: 0 0 5px rgba(255,0,0,0.5);}
        
        .history-img { width: 100%; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;}
        .empty-tip { text-align: center; color: rgba(0,206,201,0.5); font-size: 13px; padding: 40px 0; letter-spacing: 1px;}

        #toast {
            visibility: hidden; background-color: #00cec9; color: #000; text-align: center; padding: 10px 20px; position: fixed; 
            z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; box-shadow: 0 0 20px rgba(0, 206, 201, 0.8); opacity: 0; transition: opacity 0.3s; border-radius: 20px;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 40px; }

        /* ========================================================
           【核心适配】 移动端（手机）响应式布局
           ======================================================== */
        @media (max-width: 800px) {
            body { padding: 10px; background-size: 20px 20px; }
            .header { flex-direction: column; gap: 15px; padding: 15px; text-align: center; }
            .title { font-size: 22px; }
            .right-header { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .clock { font-size: 18px; width: 100%;}
            .dashboard { grid-template-columns: 1fr; gap: 15px; }
            .sensor-box { padding: 10px; }
            .sensor-icon { font-size: 26px; margin-bottom: 2px;}
            .sensor-value { font-size: 24px; }
            .sensor-label { font-size: 11px; }
            .history-container { max-height: 350px; }
            .stats-bar { flex-direction: column; gap: 5px; align-items: flex-start; }
            .search-row { flex-direction: column; }
            .search-input { width: 100%; }
            .action-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title-box">
            <div class="title">OMNI-VISION <span>智能环卫总控</span></div>
        </div>
        <div class="right-header">
            <div class="clock" id="live-clock">00:00:00</div>
            <button class="action-btn" onclick="shareDashboard()">🔗 分享控制台</button>
            <div class="status-badge">
                <div id="status-dot" class="dot"></div>
                <span id="status-text" style="color:#ff4757;">系统离线连接断开</span>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <div class="card-inner-corner1"></div>
            <div class="card-inner-corner2"></div>
            <div class="section-title">现场实况监控 <span>[ 节点_01_在线 ]</span></div>
            
            <div id="emergency-banner">
                [ 系统最高警报 ]: <span id="emergency-text"></span>
            </div>

            <div class="video-wrapper">
                <div class="scanline"></div>
                <img id="stream-img" src="" alt="等待边缘计算节点视频流传输..." />
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="card" style="padding: 20px;">
                <div class="card-inner-corner1"></div>
                <div class="card-inner-corner2"></div>
                <div class="section-title">边缘感知阵列 <span>[ 实时遥测 ]</span></div>
                
                <div class="sensor-grid" style="margin: 0;">
                    <div class="sensor-box">
                        <div class="sensor-icon">🌡️</div>
                        <div class="sensor-label">环境核心温度</div>
                        <div class="sensor-value" id="val-temp">-- <span class="sensor-unit">°C</span></div>
                    </div>
                    <div class="sensor-box">
                        <div class="sensor-icon">💧</div>
                        <div class="sensor-label">空气相对湿度</div>
                        <div class="sensor-value" id="val-humi">-- <span class="sensor-unit">%</span></div>
                    </div>
                    <div class="sensor-box">
                        <div class="sensor-icon" id="icon-mq2">💨</div>
                        <div class="sensor-label" id="label-mq2">可燃气/烟雾指数</div>
                        <div class="sensor-value" id="val-mq2">--</div>
                    </div>
                    <div class="sensor-box">
                        <div class="sensor-icon" id="icon-ir">🛡️</div>
                        <div class="sensor-label">防区人员感知</div>
                        <div class="sensor-value" id="val-ir" style="font-size: 18px;">--</div>
                    </div>
                </div>
            </div>

            <div class="card" style="flex-grow: 1;">
                <div class="card-inner-corner1"></div>
                <div class="card-inner-corner2"></div>
                <div class="section-title">异常事件智搜归档 <span>[ 数据库 ]</span></div>
                
                <div class="history-controls">
                    <div class="stats-bar">
                        <span>总保留日志: <span id="stat-total" style="color:#fff;">0</span> 条</span>
                        <span class="stat-danger">消防极危警报: <span id="stat-fire" style="color:#fff;">0</span> 条</span>
                    </div>
                    <div class="search-row">
                        <input type="text" id="search-input" class="search-input" placeholder="🔍 检索数据库 (例如: 烟雾, 溢满)..." oninput="renderHistory()">
                        <button class="action-btn" onclick="clearHistory()" style="padding: 6px 12px;">🗑️ 清空</button>
                    </div>
                </div>

                <div class="history-container" id="history-container">
                    <div class="empty-tip">> 暂未查询到异常记录</div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">复制成功！请粘贴发送给其他人</div>

    <script>
        // 时钟逻辑
        setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
            const ms = Math.floor(now.getMilliseconds() / 10).toString().padStart(2, '0');
            document.getElementById('live-clock').innerText = `${timeStr}:${ms}`;
        }, 50);

        const BASE_TOPIC = "2428510019ljz";
        const BROKER = "broker.emqx.io";
        const PORT = 8084;

        let alertHistory = JSON.parse(localStorage.getItem('my_alert_history') || '[]');
        
        const container = document.getElementById("history-container");
        const streamImg = document.getElementById("stream-img");
        const dot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const emergencyBanner = document.getElementById("emergency-banner");
        const emergencyText = document.getElementById("emergency-text");

        renderHistory();

        const client = new Paho.MQTT.Client(BROKER, PORT, "OV_UI_" + Math.random().toString(16).substr(2, 8));

        function onConnect() {
            dot.classList.add("active");
            statusText.innerText = "系统通讯正常 // 数据加密传输中";
            statusText.style.color = "#00ff88";
            client.subscribe(BASE_TOPIC + "/stream");
            client.subscribe(BASE_TOPIC + "/alert");
            client.subscribe(BASE_TOPIC + "/sensor"); 
        }

        let emergencyTimeout = null;

        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = JSON.parse(message.payloadString);

            if (topic.includes("/stream")) {
                streamImg.src = "data:image/jpeg;base64," + payload.image;
            } 
            else if (topic.includes("/alert")) {
                addNewAlert(payload);
                if (payload.msg && payload.msg.includes("异常")) {
                    emergencyText.innerHTML = payload.msg;
                    emergencyBanner.style.display = "block";
                    clearTimeout(emergencyTimeout);
                    emergencyTimeout = setTimeout(() => { emergencyBanner.style.display = "none"; }, 15000);
                }
            }
            else if (topic.includes("/sensor")) {
                updateSensors(payload);
            }
        }

        function updateSensors(data) {
            if(data.temp !== undefined) {
                const el = document.getElementById("val-temp");
                el.innerHTML = data.temp + ' <span class="sensor-unit">°C</span>';
                if(data.temp >= 40.0) { el.style.color = "#ff4757"; el.style.textShadow = "0 0 15px #ff4757"; } 
                else { el.style.color = "#fff"; el.style.textShadow = "0 0 10px rgba(255,255,255,0.5)"; }
            }
            if(data.humi !== undefined) {
                const el = document.getElementById("val-humi");
                el.innerHTML = data.humi + ' <span class="sensor-unit">%</span>';
                if(data.humi <= 20.0) { el.style.color = "#ff4757"; el.style.textShadow = "0 0 15px #ff4757"; } 
                else { el.style.color = "#fff"; el.style.textShadow = "0 0 10px rgba(255,255,255,0.5)"; }
            }
            if(data.mq2 !== undefined) {
                const elMq2 = document.getElementById("val-mq2");
                const labelMq2 = document.getElementById("label-mq2");
                const iconMq2 = document.getElementById("icon-mq2");
                elMq2.innerText = data.mq2;
                if(data.mq2 > 600) {
                    elMq2.style.color = "#ff4757"; elMq2.style.textShadow = "0 0 15px #ff4757";
                    labelMq2.innerText = "🔥 气体超标警报"; labelMq2.style.color = "#ff4757";
                    iconMq2.innerText = "🔥";
                } else {
                    elMq2.style.color = "#fff"; elMq2.style.textShadow = "0 0 10px rgba(255,255,255,0.5)";
                    labelMq2.innerText = "可燃气/烟雾指数"; labelMq2.style.color = "#a4b0be";
                    iconMq2.innerText = "💨";
                }
            }
            if(data.ir !== undefined) {
                const elIr = document.getElementById("val-ir");
                const iconIr = document.getElementById("icon-ir");
                if(data.ir === 0) {
                    elIr.innerText = "监测到活动人员"; elIr.style.color = "#feca57"; elIr.style.textShadow = "0 0 10px #feca57";
                    iconIr.innerText = "🚶‍♂️";
                } else {
                    elIr.innerText = "防区安全静止"; elIr.style.color = "#00ff88"; elIr.style.textShadow = "0 0 10px #00ff88";
                    iconIr.innerText = "🛡️";
                }
            }
        }

        function addNewAlert(data) {
            const timestamp = new Date(data.timestamp * 1000).toLocaleString('zh-CN', {hour12: false});
            const alertText = data.msg || "未知异常状态"; 
            const isEmergency = alertText.includes("异常");
            const newRecord = { time: timestamp, img: data.image, msg: alertText, isEmergency: isEmergency, id: Date.now() };
            
            alertHistory.unshift(newRecord);
            if (alertHistory.length > 50) alertHistory = alertHistory.slice(0, 50);
            localStorage.setItem('my_alert_history', JSON.stringify(alertHistory));
            renderHistory();
        }

        function renderHistory() {
            const total = alertHistory.length;
            const fireCount = alertHistory.filter(item => item.isEmergency).length;
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-fire').innerText = fireCount;

            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            const filteredHistory = alertHistory.filter(item => {
                return item.msg.toLowerCase().includes(searchTerm) || item.time.includes(searchTerm);
            });

            if (filteredHistory.length === 0) {
                container.innerHTML = '<div class="empty-tip">> 暂未查询到符合条件的记录</div>';
                return;
            }
            
            container.innerHTML = '';
            filteredHistory.forEach((item) => {
                const emergencyClass = item.isEmergency ? "emergency" : "";
                const prefix = item.isEmergency ? "🚨 [消防极危]" : "⚠️ [常规警报]";
                
                const div = document.createElement('div');
                div.className = `history-item ${emergencyClass}`;
                div.innerHTML = `
                    <div class="history-header">
                        <span class="history-header-time">发生时间: ${item.time}</span>
                        <span class="history-header-title">${prefix} ${item.msg}</span>
                    </div>
                    <img class="history-img" src="data:image/jpeg;base64,${item.img}" />
                `;
                container.appendChild(div);
            });
        }

        function clearHistory() {
            if(confirm('系统警告：您确定要彻底清空本地数据库中的所有异常日志吗？此操作不可逆！')) {
                alertHistory = [];
                localStorage.removeItem('my_alert_history');
                document.getElementById('search-input').value = '';
                renderHistory();
            }
        }

        function shareDashboard() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: '智能环卫总控中心', url: url }).catch(console.error);
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    const toast = document.getElementById("toast");
                    toast.className = "show";
                    setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
                }).catch(err => { alert('浏览器拒绝了剪贴板访问权限'); });
            }
        }

        client.onConnectionLost = (e) => { 
            if(e.errorCode !== 0) {
                statusText.innerText = "系统错误 // 连接已断开";
                statusText.style.color = "#ff4757";
                dot.classList.remove("active");
            }
        };

        client.onMessageArrived = onMessageArrived;
        client.connect({ useSSL: true, onSuccess: onConnect, keepAliveInterval: 30 });
    </script>
</body>
</html>
