<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧城市·垃圾监测大屏 PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        /* === 极致科幻风样式 === */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Rajdhani', sans-serif;
            background: radial-gradient(circle at center, #0a1128 0%, #000000 100%);
            color: #e0e6ed; min-height: 100vh; padding: 20px; overflow-x: hidden;
        }
        
        /* === 顶部炫酷导航栏 === */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding: 15px 30px;
            background: linear-gradient(90deg, rgba(0, 206, 201, 0.1) 0%, rgba(25, 30, 45, 0.6) 50%, rgba(0, 206, 201, 0.1) 100%);
            border-radius: 12px; border: 1px solid rgba(0, 206, 201, 0.3);
            box-shadow: 0 0 20px rgba(0, 206, 201, 0.2);
        }
        .title { font-size: 26px; font-weight: 700; color: #00cec9; text-shadow: 0 0 10px rgba(0,206,201,0.5); letter-spacing: 2px;}
        .status-indicator { display: flex; align-items: center; font-size: 15px; font-weight: bold; }
        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; background-color: #ff4757; box-shadow: 0 0 10px #ff4757;}
        .dot.active { background-color: #00ff88; box-shadow: 0 0 15px #00ff88; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); } }

        /* === 核心网格布局 === */
        .dashboard { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        @media (max-width: 1000px) { .dashboard { grid-template-columns: 1fr; } }

        /* === 赛博卡片样式 === */
        .card {
            background: rgba(16, 22, 36, 0.8); backdrop-filter: blur(15px);
            border-radius: 16px; padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 206, 201, 0.05), 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        /* 边角装饰 */
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 30px; height: 3px; background: #00cec9; }
        .section-title { font-size: 18px; color: #fff; margin-bottom: 20px; font-weight: 600; display: flex; align-items: center;}
        .section-title span { color: #00cec9; margin-right: 10px; font-size: 20px;}

        /* === 视频流区域 === */
        .video-container { position: relative; width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid rgba(0, 206, 201, 0.2); }
        #stream-img { width: 100%; aspect-ratio: 4/3; background: #000; object-fit: contain; display: block;}
        .video-overlay { position: absolute; top: 15px; right: 15px; background: rgba(255, 71, 87, 0.8); color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; animation: blink 2s infinite; display: none;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* === 传感器数据网格 === */
        .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .sensor-box {
            background: linear-gradient(145deg, rgba(26, 32, 53, 0.9), rgba(16, 22, 36, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 20px 15px;
            text-align: center; transition: all 0.3s ease; position: relative;
        }
        .sensor-box:hover { transform: translateY(-5px); border-color: rgba(0, 206, 201, 0.5); box-shadow: 0 5px 15px rgba(0, 206, 201, 0.2); }
        .sensor-icon { font-size: 28px; margin-bottom: 8px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));}
        .sensor-value { font-size: 26px; font-family: 'Rajdhani', sans-serif; font-weight: 700; color: #fff; margin: 5px 0; letter-spacing: 1px;}
        .sensor-label { font-size: 12px; color: #8395a7; text-transform: uppercase; letter-spacing: 1px;}

        /* === 报警历史列表样式 === */
        .history-container { flex-grow: 1; overflow-y: auto; max-height: 400px; padding-right: 10px; }
        .history-container::-webkit-scrollbar { width: 4px; }
        .history-container::-webkit-scrollbar-thumb { background: #00cec9; border-radius: 4px; }
        
        .history-item {
            background: rgba(255, 71, 87, 0.05); border-left: 4px solid #ff4757; margin-bottom: 15px; padding: 15px;
            border-radius: 8px; transition: all 0.3s;
        }
        .history-item:hover { background: rgba(255, 71, 87, 0.1); transform: translateX(5px); }
        .history-header { display: flex; justify-content: space-between; color: #ff6b81; font-size: 14px; margin-bottom: 10px; font-weight: bold;}
        .history-img { width: 100%; border-radius: 8px; border: 1px solid rgba(255,71,87,0.3); box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        .empty-tip { text-align: center; color: #8395a7; font-size: 14px; padding: 40px 0; font-style: italic;}
        
        .clear-btn {
            background: transparent; border: 1px solid rgba(255, 71, 87, 0.5); color: #ff4757; cursor: pointer; 
            padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; transition: all 0.3s;
        }
        .clear-btn:hover { background: #ff4757; color: white; box-shadow: 0 0 10px #ff4757; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">♻️ OMNI-VISION 智能环卫总控</div>
        <div class="status-indicator">
            <div id="status-dot" class="dot"></div>
            <span id="status-text" style="color:#ff4757;">SYSTEM OFFLINE</span>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <div class="section-title"><span>📷</span> 现场实时监控网络 (LIVE)</div>
            <div class="video-container">
                <div id="alert-badge" class="video-overlay">⚠️ 溢满预警</div>
                <img id="stream-img" src="" alt="等待节点视频流接入..." />
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 25px;">
            <div class="card">
                <div class="section-title"><span>📊</span> 终端阵列数据</div>
                <div class="sensor-grid">
                    <div class="sensor-box">
                        <div class="sensor-icon">🌡️</div>
                        <div class="sensor-value" id="val-temp">-- ℃</div>
                        <div class="sensor-label">环境温度</div>
                    </div>
                    <div class="sensor-box">
                        <div class="sensor-icon">💧</div>
                        <div class="sensor-value" id="val-humi">-- %</div>
                        <div class="sensor-label">空气湿度</div>
                    </div>
                    <div class="sensor-box">
                        <div class="sensor-icon">💨</div>
                        <div class="sensor-value" id="val-mq2">--</div>
                        <div class="sensor-label" id="label-mq2">VOCs / 烟雾</div>
                    </div>
                    <div class="sensor-box">
                        <div class="sensor-icon" id="icon-ir">🛡️</div>
                        <div class="sensor-value" id="val-ir" style="font-size: 20px;">--</div>
                        <div class="sensor-label">防区动态</div>
                    </div>
                </div>
            </div>

            <div class="card" style="flex-grow: 1;">
                <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <div class="section-title" style="margin: 0;"><span>🚨</span> 溢满抓拍归档</div>
                    <button class="clear-btn" onclick="clearHistory()">清除日志</button>
                </div>
                <div class="history-container" id="history-container">
                    <div class="empty-tip">监控矩阵无异常记录</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_TOPIC = "2428510019ljz";
        const BROKER = "broker.emqx.io";
        const PORT = 8084;

        let alertHistory = JSON.parse(localStorage.getItem('my_alert_history') || '[]');
        
        const container = document.getElementById("history-container");
        const streamImg = document.getElementById("stream-img");
        const dot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const alertBadge = document.getElementById("alert-badge");

        // 传感器 DOM 节点
        const elTemp = document.getElementById("val-temp");
        const elHumi = document.getElementById("val-humi");
        const elMq2 = document.getElementById("val-mq2");
        const labelMq2 = document.getElementById("label-mq2");
        const elIr = document.getElementById("val-ir");
        const iconIr = document.getElementById("icon-ir");

        renderHistory();

        const client = new Paho.MQTT.Client(BROKER, PORT, "web_" + Math.random().toString(16).substr(2, 8));

        function onConnect() {
            dot.classList.add("active");
            statusText.innerText = "SYSTEM ONLINE";
            statusText.style.color = "#00ff88";
            client.subscribe(BASE_TOPIC + "/stream");
            client.subscribe(BASE_TOPIC + "/alert");
            client.subscribe(BASE_TOPIC + "/sensor"); 
        }

        let alertTimeout = null;
        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = JSON.parse(message.payloadString);

            if (topic.includes("/stream")) {
                streamImg.src = "data:image/jpeg;base64," + payload.image;
            } 
            else if (topic.includes("/alert")) {
                addNewAlert(payload);
                // 触发视频右上角警告闪烁动画
                alertBadge.style.display = "block";
                clearTimeout(alertTimeout);
                alertTimeout = setTimeout(() => { alertBadge.style.display = "none"; }, 5000);
            }
            else if (topic.includes("/sensor")) {
                updateSensors(payload);
            }
        }

        function updateSensors(data) {
            if(data.temp !== undefined) elTemp.innerText = data.temp + " ℃";
            if(data.humi !== undefined) elHumi.innerText = data.humi + " %";
            
            if(data.mq2 !== undefined) {
                elMq2.innerText = data.mq2;
                if(data.mq2 > 600) {
                    elMq2.style.color = "#ff4757"; elMq2.style.textShadow = "0 0 10px #ff4757";
                    labelMq2.innerText = "⚠️ 气体超标";
                } else {
                    elMq2.style.color = "#fff"; elMq2.style.textShadow = "none";
                    labelMq2.innerText = "VOCs / 烟雾";
                }
            }

            if(data.ir !== undefined) {
                if(data.ir === 0) {
                    elIr.innerText = "活动侵入"; elIr.style.color = "#eccc68";
                    iconIr.innerText = "🚶";
                } else {
                    elIr.innerText = "安全静止"; elIr.style.color = "#00cec9";
                    iconIr.innerText = "🛡️";
                }
            }
        }

        function addNewAlert(data) {
            const timestamp = new Date(data.timestamp * 1000).toLocaleString();
            const newRecord = { time: timestamp, img: data.image, id: Date.now() };
            alertHistory.unshift(newRecord);
            if (alertHistory.length > 10) alertHistory = alertHistory.slice(0, 10);
            localStorage.setItem('my_alert_history', JSON.stringify(alertHistory));
            renderHistory();
        }

        function renderHistory() {
            if (alertHistory.length === 0) {
                container.innerHTML = '<div class="empty-tip">监控矩阵无异常记录</div>';
                return;
            }
            container.innerHTML = '';
            alertHistory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-header">
                        <span>#${index + 1} ⚠️ 溢满确证</span>
                        <span>${item.time}</span>
                    </div>
                    <img class="history-img" src="data:image/jpeg;base64,${item.img}" />
                `;
                container.appendChild(div);
            });
        }

        function clearHistory() {
            if(confirm('警告：确认清除所有防区日志？')) {
                alertHistory = [];
                localStorage.removeItem('my_alert_history');
                renderHistory();
            }
        }

        client.onConnectionLost = (e) => { 
            if(e.errorCode !== 0) {
                statusText.innerText = "RECONNECTING...";
                statusText.style.color = "#ff4757";
                dot.classList.remove("active");
            }
        };

        client.onMessageArrived = onMessageArrived;
        client.connect({ useSSL: true, onSuccess: onConnect, keepAliveInterval: 30 });
    </script>
</body>
</html>
